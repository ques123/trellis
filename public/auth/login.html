<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Trellis</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'><rect x='2' y='2' width='10' height='16' rx='2' fill='%23e2a53a' opacity='0.9'/><rect x='16' y='2' width='10' height='10' rx='2' fill='%23e2a53a' opacity='0.6'/><rect x='16' y='16' width='10' height='10' rx='2' fill='%23e2a53a' opacity='0.3'/></svg>">
  <meta name="theme-color" content="#d97b1e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --border: rgba(0,0,0,0.08);
      --border-strong: rgba(0,0,0,0.14);
      --text: #1a1a1a;
      --text-secondary: #6b6b6b;
      --text-muted: #a0a0a0;
      --accent: #d97b1e;
      --accent-light: rgba(217,123,30,0.08);
      --error: #dc3545;
      --error-bg: rgba(220,53,69,0.06);
    }
    html, body {
      height: 100%;
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 48px 40px;
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 24px rgba(0,0,0,0.04);
      animation: fadeIn 0.4s ease;
    }
    .login-icon {
      width: 48px; height: 48px;
      border-radius: 14px;
      background: var(--accent-light);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent);
      margin-bottom: 24px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 32px;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 14.5px;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s ease;
      background: var(--bg);
    }
    input[type="email"]:focus, input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }
    .field { margin-bottom: 12px; }
    .toggle {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .toggle a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }
    .toggle a:hover { text-decoration: underline; }
    button[type="submit"] {
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    button[type="submit"]:hover { opacity: 0.9; }
    button[type="submit"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .message {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.5;
      display: none;
    }
    .message.error {
      display: block;
      background: var(--error-bg);
      color: var(--error);
      border: 1px solid rgba(220,53,69,0.12);
    }
    .message.success {
      display: block;
      background: var(--accent-light);
      color: var(--accent);
      border: 1px solid rgba(217,123,30,0.12);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 480px) {
      .login-card { margin: 16px; padding: 36px 28px; }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
    </div>
    <h1>Sign in to Trellis</h1>
    <p class="subtitle" id="subtitle">Enter your email and we'll send you a magic link to sign in.</p>

    <form id="login-form">
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" autofocus>
      </div>
      <div class="field" id="password-field" style="display:none;">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
      </div>
      <button type="submit" id="submit-btn">Send magic link</button>
    </form>

    <div class="toggle">
      <a id="toggle-mode">Use password instead</a>
    </div>

    <div class="message" id="message"></div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const msg = document.getElementById('message');
    const btn = document.getElementById('submit-btn');
    const subtitle = document.getElementById('subtitle');
    const passwordField = document.getElementById('password-field');
    const passwordInput = document.getElementById('password');
    const toggleLink = document.getElementById('toggle-mode');

    let mode = 'magic';

    function setMode(next) {
      mode = next;
      if (mode === 'password') {
        subtitle.textContent = 'Enter your email and password to sign in.';
        passwordField.style.display = '';
        passwordInput.required = true;
        btn.textContent = 'Sign in';
        toggleLink.textContent = 'Use magic link instead';
      } else {
        subtitle.textContent = "Enter your email and we'll send you a magic link to sign in.";
        passwordField.style.display = 'none';
        passwordInput.required = false;
        btn.textContent = 'Send magic link';
        toggleLink.textContent = 'Use password instead';
      }
      msg.className = 'message';
      msg.style.display = 'none';
    }

    toggleLink.addEventListener('click', () => {
      setMode(mode === 'magic' ? 'password' : 'magic');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) return;

      const password = passwordInput.value;
      if (mode === 'password' && !password) return;

      btn.disabled = true;
      btn.textContent = mode === 'password' ? 'Signing in...' : 'Sending...';
      msg.className = 'message';
      msg.style.display = 'none';

      try {
        if (mode === 'password') {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json().catch(() => ({}));

          if (res.ok) {
            window.location.href = '/';
            return;
          }
          msg.className = 'message error';
          msg.textContent = data.error || 'Sign in failed. Please try again.';
          btn.disabled = false;
          btn.textContent = 'Sign in';
        } else {
          const res = await fetch('/api/auth/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json();

          if (res.ok) {
            msg.className = 'message success';
            msg.textContent = 'Check your email for a magic link to sign in.';
            form.style.display = 'none';
            toggleLink.parentElement.style.display = 'none';
          } else {
            msg.className = 'message error';
            msg.textContent = data.error || 'Something went wrong. Please try again.';
            btn.disabled = false;
            btn.textContent = 'Send magic link';
          }
        }
      } catch (err) {
        msg.className = 'message error';
        msg.textContent = 'Network error. Please try again.';
        btn.disabled = false;
        btn.textContent = mode === 'password' ? 'Sign in' : 'Send magic link';
      }
    });
  </script>
</body>
</html>
